SectionVerb {
 Value {
  TQ "HiFi"
 }
 EnableSequence [
		cset "name='DAC1 Playback Volume' 175"
		cset "name='DAC1 Playback Switch' 1"
		cset "name='DAC L1 Mux' IF1 DAC1"
		cset "name='DAC R1 Mux' IF1 DAC1"
		cset "name='DAC1 MIXL DAC1 Switch' 1"
		cset "name='DAC1 MIXR DAC1 Switch' 1"
		cset "name='Stereo DAC MIXL DAC L1 Switch' 1"
		cset "name='Stereo DAC MIXR DAC R1 Switch' 1"
		cset "name='DAC L2 Source' Stereo DAC Mixer"
		cset "name='DAC R2 Source' Stereo DAC Mixer"
		cset "name='SPK MIXL DAC L2 Switch' 1"
		cset "name='SPK MIXR DAC R2 Switch' 1"
		cset "name='SPKVOL L Switch' 1"
		cset "name='SPKVOL R Switch' 1"
		cset "name='SPO L MIX SPKVOL L Switch' 1"
		cset "name='SPO R MIX SPKVOL R Switch' 1"
		cset "name='SPO Playback Switch' 1"
		cset "name='HPO L Playback Switch' 1"
		cset "name='HPO R Playback Switch' 1"
		cset "name='Speaker Playback Volume' 31"
		cset "name='Headphone Playback Volume' 31"
 ]
}
SectionDevice."Speaker" {
 Comment "Speakers"
 Value {
  PlaybackPCM "hw:${CardId},0"
 }
 EnableSequence [
		cset "name='SPK Switch' 1"
 ]
 DisableSequence [
		cset "name='SPK Switch' 0"
 ]
}
SectionDevice."Headphones" {
 Comment "Headphones"
 Value {
  PlaybackPCM "hw:${CardId},0"
  JackControl "Headphone Jack"
 }
 EnableSequence [
		cset "name='HP Switch' 1"
 ]
 DisableSequence [
		cset "name='HP Switch' 0"
 ]
}
SectionDevice."Mic" {
 Comment "Internal microphone"
 Value {
  CapturePCM "hw:${CardId},0"
 }
 EnableSequence [
		cset "name='Stereo1 ADC Source' ADC1"
		cset "name='Stereo1 ADC1 Source' ADC"
		cset "name='IN3 Boost Volume' 53"
		cset "name='RECMIX1L BST3 Switch' 1"
		cset "name='RECMIX1R BST3 Switch' 1"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 1"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 1"
		cset "name='Main Mic Switch' 1"
 ]
 DisableSequence [
		cset "name='Main Mic Switch' 0"
		cset "name='Stereo1 ADC MIXL ADC1 Switch' 0"
		cset "name='Stereo1 ADC MIXR ADC1 Switch' 0"
		cset "name='RECMIX1L BST3 Switch' 0"
		cset "name='RECMIX1R BST3 Switch' 0"
 ]
}
